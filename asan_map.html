<!DOCTYPE html>
<html lang='ko'>
<head>
  <meta charset='utf-8'>
  <title>아산출고센터 지도</title>
  <script src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=e24b99513c25ef077055f7b24a034575'></script>
  <style>
    body { margin:0; }
    #map { width:100%; height:100vh; }
    #info {
      position:absolute;
      top:10px;
      left:10px;
      background:white;
      padding:10px;
      border-radius:8px;
      font-weight:bold;
      z-index:10;
    }
  </style>
</head>
<body>

<div id='info'>위치 확인 중...</div>
<div id='map'></div>

<script>
var map = new kakao.maps.Map(document.getElementById('map'), {
  center: new kakao.maps.LatLng(36.79, 126.98),
  level: 3
});

var marker = new kakao.maps.Marker();

navigator.geolocation.watchPosition(function(pos) {
  var lat = pos.coords.latitude;
  var lng = pos.coords.longitude;

  var loc = new kakao.maps.LatLng(lat, lng);

  marker.setMap(map);
  marker.setPosition(loc);
  map.setCenter(loc);

  document.getElementById('info').innerText = '현재 위치 추적 중';
});
</script>

</body>
</html>
