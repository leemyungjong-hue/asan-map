<title>아산출고 치장장 MAP</title>
<style>

}

padding: 8px 14px; border-radius: 12px; font-size: 11px; color: #cbd5e1;

position: absolute; bottom: 20px; left: 16px; z-index: 1000;

/* 구역명칭 스타일: 하얀색(#ffffff), 굵은 볼드체, 완벽한 정중앙 정렬 /
.zone-label {
background: transparent; color: #ffffff; font-weight: 800;
font-size: 14px; / 줌 15 기준 크기 (하단 버튼 크기와 동일) */
text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.9);
text-align: center; white-space: nowrap;
transform: translate(-50%, -50%);
transition: opacity 0.2s ease;
}

#crosshair {
position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
margin-left: -10px; margin-top: -10px; z-index: 999; pointer-events: none;
display: flex; align-items: center; justify-content: center;
font-size: 22px; color: #ef4444; font-weight: bold; text-shadow: 0 0 4px #000;
}

#coord-btn {
position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 1000;
background: linear-gradient(135deg, #10b981, #059669); color: white; border: none;
padding: 10px 20px; border-radius: 25px; font-weight: 700; font-size: 13px;
box-shadow: 0 4px 20px rgba(16, 185, 129, 0.6); cursor: pointer; white-space: nowrap;
}

#btn {
position: absolute; bottom: 24px; right: 16px; z-index: 1000;

<!-- 캐시 무시용 버전 번호 갱신 (v6) -->
<script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=fs946skmco&v=20261022-v6"></script>
</head>
<body>
<div id="title">아산출고 치장장 MAP</div>

<div id="welcome-guide-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:999999; display:flex; align-items:center; justify-content:center;">
<div style="background:rgba(15,23,42,0.96); border:2px solid rgba(52,211,153,0.9); border-radius:22px; padding:26px 22px; width:88%; max-width:340px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.9);">
<p style="margin:0 0 18px 0; color:#f8fafc; font-size:14px; font-weight:600; line-height:1.6; word-break:keep-all;">우측 하단 빨간 버튼을 누르면 현재 위치가 표시되며 로케이션 검색시 길안내가 시작됩니다</p>
<button onclick="closeGuide()" style="background:linear-gradient(135deg, #34d399, #059669); color:#ffffff; border:none; padding:12px 0; width:100%; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 4px 15px rgba(52,211,153,0.5);">확 인</button>
</div>
</div>

<div id="crosshair">✚</div>
<button id="coord-btn" onclick="getCenterCoord()">🎯 현재 화면 중앙 좌표 따기</button>

<div id="search-box">
<input type="text" id="search-input" placeholder="검색 예: Y1001, Y 1001" oninput="this.value = this.value.toUpperCase()">
<button id="search-btn" onclick="searchLocation()">로케이션 검색</button>
</div>

<button id="cancel-nav-btn" onclick="cancelNavigation()">❌ 길안내 취소</button>

<div id="status">GPS 연결 대기 중...</div>
<div id="creator-credit">제작 : 아산출고 이명종 책임매니저</div>

<button id="btn" onclick="moveToCurrentPos()">📍</button>
<div id="map"></div>

<script>
var map = new naver.maps.Map('map', {
center: new naver.maps.LatLng(36.8522, 126.8610),
zoom: 15, /* 전체 치장장이 한눈에 보이는 줌 15로 초기 설정 */
mapTypeId: naver.maps.MapTypeId.HYBRID,
scaleControl: false,
logoControl: false,
mapDataControl: false
});

setTimeout(function() {
window.dispatchEvent(new Event('resize'));
naver.maps.Event.trigger(map, 'resize');
}, 300);

var currentPos = null;
var gpsMarker = null;
var targetMarker = null;
var navLine = null;
var statusDiv = document.getElementById('status');
window.activeTarget = null;
var labelElements = [];

function closeGuide() {
var overlay = document.getElementById('welcome-guide-overlay');
if (overlay) {
overlay.style.opacity = '0';
overlay.style.transition = 'opacity 0.3s ease';
setTimeout(function() {
overlay.style.display = 'none';
}, 300);
}
}

function moveToCurrentPos() {
closeGuide();
if (currentPos) {
map.setCenter(currentPos);
map.setZoom(19);
}
}

var zoneStyles = {
"PA": {color: "#38bdf8", fill: "#38bdf8"}, "P": {color: "#818cf8", fill: "#818cf8"},
"Y": {color: "#facc15", fill: "#facc15"}, "C": {color: "#34d399", fill: "#34d399"},
"B": {color: "#fb7185", fill: "#fb7185"}, "A": {color: "#c084fc", fill: "#c084fc"},
"수출": {color: "#22d3ee", fill: "#22d3ee"}, "배송동": {color: "#fbbf24", fill: "#fbbf24"},
"R": {color: "#f472b6", fill: "#f472b6"}, "RA": {color: "#a78bfa", fill: "#a78bfa"},
"KA": {color: "#4ade80", fill: "#4ade80"}, "K": {color: "#60a5fa", fill: "#60a5fa"},
"JA": {color: "#fb923c", fill: "#fb923c"}, "J": {color: "#e879f9", fill: "#e879f9"},
"IA": {color: "#2dd4bf", fill: "#2dd4bf"}, "I": {color: "#818cf8", fill: "#818cf8"},
"H": {color: "#facc15", fill: "#facc15"}, "HA": {color: "#34d399", fill: "#34d399"},
"HB": {color: "#fb7185", fill: "#fb7185"}, "N": {color: "#38bdf8", fill: "#38bdf8"},
"M": {color: "#c084fc", fill: "#c084fc"}, "L": {color: "#4ade80", fill: "#4ade80"}
};

/* 각 구역의 라벨 좌표를 완벽한 정중앙으로 재조정 */
var zones = [
{name:"PA", coords:[[36.852540,126.859131],[36.852540,126.8603],[36.852021,126.8603],[36.851880,126.8602],[36.8517,126.8600],[36.851712,126.859092]], label:[36.85212,126.85970]},
{name:"P", coords:[[36.852521,126.8604],[36.852521,126.8613],[36.8520,126.8613],[36.8520,126.8604]], label:[36.85226,126.86085]},
{name:"Y", coords:[[36.8505, 126.8576],[36.850744,126.857941],[36.85085, 126.85820],[36.85085, 126.85870],[36.84890, 126.85870],[36.8499, 126.8576]], label:[36.84987,126.85815]},
{name:"C", coords:[[36.85085,126.85875],[36.85085,126.8599],[36.84867,126.8599],[36.84867,126.85875]], label:[36.84976,126.85932]},
{name:"B", coords:[[36.85085,126.8600],[36.85085,126.86112],[36.84867,126.86112],[36.84867,126.8600]], label:[36.84976,126.86056]},
{name:"A", coords:[[36.85085,126.86122],[36.85085,126.86238],[36.84867,126.86238],[36.84867,126.86122]], label:[36.84976,126.86180]},
{name:"수출", coords:[[36.8486,126.8585],[36.8486,126.8635],[36.8463,126.8635],[36.8463,126.8585]], label:[36.84745,126.86100]},
{name:"배송동", coords:[[36.85085,126.8624],[36.85085,126.8635],[36.84867,126.8635],[36.84867,126.8624]], label:[36.84976,126.86295]},
{name:"R", coords:[[36.8500,126.8639],[36.8500,126.86597],[36.84863,126.86597],[36.84863,126.8644],[36.8488,126.8639]], label:[36.84931,126.86498]},
{name:"RA", coords:[[36.8508,126.8639],[36.8508,126.86597],[36.85005,126.86597],[36.85005,126.8639]], label:[36.85042,126.86498]},
{name:"KA", coords:[[36.8484,126.8639],[36.8486,126.8644],[36.8486,126.86597],[36.84785,126.86597],[36.84785,126.8639]], label:[36.84822,126.86493]},
{name:"K", coords:[[36.8478,126.8639],[36.8478,126.86597],[36.84644,126.86597],[36.84644,126.8642],[36.8467,126.8639]], label:[36.84712,126.86500]},
{name:"JA", coords:[[36.85005,126.86602],[36.8509,126.86602],[36.8509,126.8678],[36.85005,126.8678]], label:[36.85047,126.86691]},
{name:"J", coords:[[36.8500,126.86602],[36.84863,126.86602],[36.84863,126.8678],[36.8500,126.8678]], label:[36.84931,126.86691]},
{name:"IA", coords:[[36.84785,126.86602],[36.8486,126.86602],[36.8486,126.8679],[36.84785,126.8679]], label:[36.84822,126.86696]},
{name:"I", coords:[[36.8478,126.86602],[36.8478,126.8679],[36.84644,126.8679],[36.846442,126.867541],[36.8466326,126.867539],[36.8466326,126.866111],[36.846442,126.866111],[36.84644,126.86602]], label:[36.84712,126.86696]},
{name:"H", coords:[[36.84785,126.86815],[36.84785,126.86935],[36.8465,126.86935],[36.8465,126.86815]], label:[36.84717,126.86875]},
{name:"HA", coords:[[36.8479,126.86815],[36.8486,126.86815],[36.8486,126.86935],[36.8479,126.86935]], label:[36.84825,126.86875]},
{name:"HB", coords:[[36.84863,126.86815],[36.850166,126.86815],[36.850166,126.86935],[36.84863,126.86935]], label:[36.84940,126.86875]},
{name:"N", coords:[[36.84592,126.8653],[36.84592,126.86722],[36.84455,126.86722],[36.84455,126.8668],[36.84580,126.8653]], label:[36.84523,126.86626]},
{name:"M", coords:[[36.84592,126.8672],[36.84592,126.8687],[36.8445,126.8687],[36.8445,126.8672]], label:[36.84521,126.86795]},
{name: "L", coords:[[36.84592,126.8687],[36.84592,126.8702],[36.8442,126.8702],[36.8442,126.8692],[36.8445,126.8692],[36.8445,126.8687]], label:[36.84506,126.86945]}
];

zones.forEach(z => {
try {
var style = zoneStyles[z.name] || {color: "#facc15", fill: "#facc15"};
var path = z.coords.map(c => new naver.maps.LatLng(c[0], c[1]));

new naver.maps.Polygon({
map: map,
paths: path,
strokeColor: style.color,
strokeWeight: 2.5,
strokeOpacity: 0.9,
fillColor: style.fill,
fillOpacity: 0.18
});

var labelDiv = document.createElement('div');
labelDiv.className = 'zone-label';
labelDiv.innerText = z.name;

new naver.maps.Marker({
map: map,
position: new naver.maps.LatLng(z.label[0], z.label[1]),
icon: {
content: labelDiv,
anchor: new naver.maps.Point(0, 0)
}
});
labelElements.push(labelDiv);
} catch(err) {}
});

/* 줌 15를 기준(scale 1.0)으로 줌인/줌아웃에 따른 글자 크기 연동 */
function updateLabelSizes() {
var zoom = map.getZoom();
var scale = Math.pow(1.3, zoom - 15);
var opacity = zoom < 14 ? 0 : 1;
var fontSize = Math.max(11, Math.round(14 * scale));

labelElements.forEach(el => {
el.style.fontSize = fontSize + 'px';
el.style.opacity = opacity;
});
}

naver.maps.Event.addListener(map, 'zoom_changed', updateLabelSizes);
setTimeout(updateLabelSizes, 300);

if (navigator.geolocation) {
navigator.geolocation.watchPosition(
p => {
currentPos = new naver.maps.LatLng(p.coords.latitude, p.coords.longitude);
if (!gpsMarker) {
gpsMarker = new naver.maps.Marker({
map: map,
position: currentPos,
icon: {
content: '<div style="width:18px;height:18px;background:#22c55e;border:3px solid #ffffff;border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>',
anchor: new naver.maps.Point(9, 9)
}
});
} else {
gpsMarker.setPosition(currentPos);
}
statusDiv.innerHTML = "GPS 수신 중 (오차: " + Math.round(p.coords.accuracy) + "m)";
if (window.activeTarget) drawNavLine(currentPos, window.activeTarget);
},
e => { statusDiv.innerHTML = "GPS 오류: " + e.message; },
{ enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
);
}

function parseY1Location(query) {
var cleanQuery = query.toUpperCase().replace(/\s+/g, '');
cleanQuery = cleanQuery.replace(/X/g, '');

var match = cleanQuery.match(/^Y(10|11)(\d{2})$/);
if (!match) return null;
var sideType = match[1];
var num = parseInt(match[2], 10);
if (num < 1 || num > 55) return null;
var southLat = 36.8490;
var northLat = 36.8507;
var ratio = (num - 1) / 54;
var targetLat = southLat + (northLat - southLat) * ratio;
var targetLng = (sideType === "10") ? 126.85867 : 126.85863;
return new naver.maps.LatLng(targetLat, targetLng);
}

function searchLocation() {
closeGuide();
var rawInput = document.getElementById('search-input').value.trim();
var targetCoord = parseY1Location(rawInput);
if (!targetCoord) {
alert("올바르지 않은 형식입니다: " + rawInput + "\n(입력 예시: Y1001~Y1055, Y1101~Y1155)");
return;
}
window.activeTarget = targetCoord;
if (targetMarker) targetMarker.setMap(null);
targetMarker = new naver.maps.Marker({
map: map,
position: targetCoord,
icon: {
content: '<div style="font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));">📍</div>',
anchor: new naver.maps.Point(12, 24)
}
});
map.setCenter(targetCoord);
map.setZoom(19);

document.getElementById('cancel-nav-btn').style.display = 'block';

if (currentPos) drawNavLine(currentPos, targetCoord);
}

function drawNavLine(start, end) {
if (navLine) navLine.setMap(null);
navLine = new naver.maps.Polyline({
map: map,
path: [start, end],
strokeColor: '#22c55e',
strokeWeight: 5,
strokeOpacity: 0.9
});
}

function cancelNavigation() {
window.activeTarget = null;
if (targetMarker) {
targetMarker.setMap(null);
targetMarker = null;
}
if (navLine) {
navLine.setMap(null);
navLine = null;
}
document.getElementById('cancel-nav-btn').style.display = 'none';
document.getElementById('search-input').value = '';
}

function getCenterCoord() {
var center = map.getCenter();
var lat = center.lat().toFixed(6);
var lng = center.lng().toFixed(6);
alert("중앙 좌표\n위도: " + lat + "\n경도: " + lng);
}
</script>
</body>
</html>
